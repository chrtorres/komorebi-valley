name: Valley regression gate
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run gate:valley
        env:
          EVIDENCE_DIR: '${{ runner.temp }}/valley-regression'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valley-regression
          path: '${{ runner.temp }}/valley-regression'
